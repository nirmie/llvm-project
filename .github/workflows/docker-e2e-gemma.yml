name: Docker E2E gemma3_4b_it (SGLang HotSwap)

# Single-model HotSwap E2E for google/gemma-3-4b-it via SGLang, following
# RUNBOOK-gemma. Runs `make sglang-hotswap-e2e-compare` inside the prebuilt
# alex_wip image on BOTH GPU runners (gfx942 MI300X + gfx950 MI350X). Each
# matrix leg = one GPU's status. Local-vs-HotSwap compare: Triton kernels
# compiled for source gfx1250 and translated at load time to the real GPU,
# then numerical equivalence is checked.
#
# PASS = HotSwap run2 has no proof failures and no cache misses, and the
# equivalence verdict is PASS (equivalent / numerically_close /
# distributionally_equivalent).

on:
  push:
    branches: [nisenthi/docker-ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-e2e-gemma-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # "gpu8" = the 8th GPU = index 7 (boxes expose card0..card7).
  GPU_INDEX: "7"

jobs:
  gemma:
    strategy:
      fail-fast: false
      matrix:
        # Per-machine image: shark300 already has alex_wip; mi350 has the
        # runbook's alex_hotswap_wip. Both share the layout + gemma3_4b_it profile.
        include:
          - { gfx: gfx942, image: "registry-sc-harbor.amd.com/rocm-hotswap/alex_wip:latest",         weights_host: /home/nisenthi/hotswap-data, model_subdir: gemma-3-4b-it }
          - { gfx: gfx950, image: "registry-sc-harbor.amd.com/rocm-hotswap/alex_hotswap_wip:latest",  weights_host: /mnt/gfx_apps/models/google,  model_subdir: gemma-3-4b-it }
    name: gemma3_4b_it (${{ matrix.gfx }})
    runs-on: [self-hosted, linux, rocm, docker, "${{ matrix.gfx }}"]
    env:
      SCRATCH_HOST: /home/nisenthi/hotswap-ci-persist/sglang-gemma-scratch
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Run HotSwap compare (gemma3_4b_it, ${{ matrix.gfx }})
        run: |
          set -euo pipefail
          mkdir -p "$SCRATCH_HOST"
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri \
            --group-add 44 --group-add 109 \
            --ipc=host --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined --security-opt label=disable \
            --network=host \
            -v "${{ matrix.weights_host }}":/data \
            -v "$SCRATCH_HOST":/scratch \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              cd /workspace/rocm-hotswap-testing
              export LD_LIBRARY_PATH=/workspace/llvm-acc/build/lib:$LD_LIBRARY_PATH
              make sglang-hotswap-e2e-compare \
                SGLANG_MODEL_PATH=/data/'"${{ matrix.model_subdir }}"' \
                SGLANG_PYTHON=/workspace/venv/bin/python \
                SGLANG_PROFILE=gemma3_4b_it \
                SGLANG_LIBHSA_RUNTIME=/workspace/rocm-systems/projects/rocr-runtime/build/rocr/lib/libhsa-runtime64.so \
                SGLANG_INTERCEPT_LIB=/workspace/rocm-hotswap-testing/build/libhotswap_intercept.so \
                SGLANG_SCRATCH_ROOT=/scratch \
                SGLANG_GPU='"$GPU_INDEX"' \
                SGLANG_TARGET_GFX='"${{ matrix.gfx }}"' \
                SGLANG_SOURCE_TARGET=gfx1250:32
            ' 2>&1 | tee "$RUNNER_TEMP/gemma-run.log"

      - name: Evaluate gate + summarize
        if: always()
        run: |
          set -uo pipefail
          SJ=$(find "$SCRATCH_HOST" -name summary.json 2>/dev/null | sort | tail -1)
          {
            echo "## gemma3_4b_it SGLang HotSwap (${{ matrix.gfx }})"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SJ" ]; then
            echo ":x: no summary.json produced (run failed before completion)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          VERDICT=$(python3 - "$SJ" <<'PY'
import json, sys
s = json.load(open(sys.argv[1]))
eq = s.get("equivalence", {}) or {}
print(f"{int(bool(eq.get('passed')))}|{eq.get('overall_status','?')}")
PY
)
          ok="${VERDICT%%|*}"; status="${VERDICT#*|}"; rc=0
          {
            echo "summary: \`$SJ\`"
            echo '```'
            echo "equivalence_passed: $ok"
            echo "overall_status:     $status"
            echo '```'
            if [ "$ok" = "1" ]; then echo ":white_check_mark: gate PASSED"; else echo ":x: gate FAILED"; rc=1; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
