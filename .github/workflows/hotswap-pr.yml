name: Hotswap PR CI

on:
  pull_request:
  push:
    branches: [hotswap]
  workflow_dispatch:
    inputs:
      force_clean:
        description: "Wipe /persist/build before configuring"
        type: boolean
        default: false

concurrency:
  group: hotswap-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lit:
    # NOTE: deliberately no top-level `container:` here. The GHA runner creates
    # a `github_network_*` bridge for each container-job and Docker allocates
    # it the next free /16 in default-address-pools, which on this shared host
    # collides with a developer laptop subnet (172.19.0.0/16) and black-holes
    # SSH. We can't restart the Docker daemon (other users have containers
    # running) so we run docker manually with --network host below — no new
    # bridge gets created.
    runs-on: [self-hosted, linux, rocm, gfx950, hotswap]
    steps:
      - uses: actions/checkout@v4

      - name: Force clean (manual trigger only)
        if: ${{ inputs.force_clean == true }}
        run: rm -rf /home/nisenthi/hotswap/test/hotswap-ci-persist/build/*

      - name: Build + lit (in rocm/pytorch container, host network)
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE":/src:ro \
            -v /home/nisenthi/hotswap/test/hotswap-ci-persist/build:/persist/build \
            -v /home/nisenthi/hotswap/test/hotswap-ci-persist/ccache:/persist/ccache \
            -e CCACHE_DIR=/persist/ccache \
            -w /persist/build \
            rocm/pytorch:latest \
            bash -c '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ninja-build ccache cmake

              # ninja stores absolute paths in depfiles; keep /persist/src stable
              # across runs (where /src varies with the GHA workspace path).
              ln -sfn /src /persist/src
              mkdir -p /persist/build/llvm /persist/build/device-libs /persist/build/comgr

              # Stage 1: LLVM + clang + lld. comgr/device-libs are standalone
              # CMake projects (not LLVM_EXTERNAL_PROJECTS), built against
              # this LLVM build dir via CMAKE_PREFIX_PATH.
              cmake -G Ninja -S /persist/src/llvm -B /persist/build/llvm \
                -DLLVM_ENABLE_PROJECTS="clang;lld" \
                -DLLVM_TARGETS_TO_BUILD="AMDGPU;X86" \
                -DCMAKE_BUILD_TYPE=Release \
                -DLLVM_CCACHE_BUILD=ON
              # -j 32 keeps load + I/O polite on the shared 256-core host.
              # Build all of LLVM (not a subset target) so comgr finds every
              # library it links against via find_package(LLVM/Clang/LLD).
              ninja -j 32 -C /persist/build/llvm

              # Stage 2: device-libs (needed for comgr).
              cmake -G Ninja -S /persist/src/amd/device-libs -B /persist/build/device-libs \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/persist/build/llvm
              ninja -j 32 -C /persist/build/device-libs

              # Stage 3: comgr — owns COMGR_ENABLE_HOTSWAP_TRANSPILE and check-comgr.
              cmake -G Ninja -S /persist/src/amd/comgr -B /persist/build/comgr \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="/persist/build/llvm;/persist/build/device-libs" \
                -DCOMGR_ENABLE_HOTSWAP_TRANSPILE=ON
              ninja -j 32 -C /persist/build/comgr check-comgr

              ccache -s
            '
