name: Hotswap PR CI

on:
  pull_request:
  push:
    branches: [hotswap]
  workflow_dispatch:
    inputs:
      force_clean:
        description: "Wipe /persist/build before configuring"
        type: boolean
        default: false

concurrency:
  group: hotswap-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lit:
    # NOTE: deliberately no top-level `container:` here. The GHA runner creates
    # a `github_network_*` bridge for each container-job and Docker allocates
    # it the next free /16 in default-address-pools, which on this shared host
    # collides with a developer laptop subnet (172.19.0.0/16) and black-holes
    # SSH. We can't restart the Docker daemon (other users have containers
    # running) so we run docker manually with --network host below — no new
    # bridge gets created.
    runs-on: [self-hosted, linux, rocm, gfx950, hotswap]
    steps:
      - uses: actions/checkout@v4

      - name: Force clean (manual trigger only)
        if: ${{ inputs.force_clean == true }}
        run: rm -rf /home/nisenthi/hotswap/test/hotswap-ci-persist/build/*

      - name: Build + lit (in rocm/pytorch container, host network)
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE":/src:ro \
            -v /home/nisenthi/hotswap/test/hotswap-ci-persist/build:/persist/build \
            -v /home/nisenthi/hotswap/test/hotswap-ci-persist/ccache:/persist/ccache \
            -e CCACHE_DIR=/persist/ccache \
            -w /persist/build \
            rocm/pytorch:latest \
            bash -c '
              set -euxo pipefail
              echo "=== diagnostic: container view ==="
              ls -la /persist /src | head -20
              ls /src/llvm/CMakeLists.txt
              echo "=== /src is bind-mounted from GHA workspace; populated by actions/checkout ==="

              apt-get update
              apt-get install -y --no-install-recommends ninja-build ccache cmake

              # Container runs as root; /src is bind-mounted from the host
              # ($GITHUB_WORKSPACE, uid 1000), so git refuses to operate on
              # it without an explicit safe.directory exception. comgr reads
              # git commit/branch into COMGR_GIT_COMMIT/COMGR_GIT_BRANCH at
              # configure time; without this they end up "not-available".
              git config --global --add safe.directory /src
              git config --global --add safe.directory /persist/src

              # ninja stores absolute paths in depfiles; keep /persist/src stable
              # across runs (where /src varies with the GHA workspace path).
              ln -sfn /src /persist/src
              echo "=== after symlink ==="
              ls -la /persist
              ls /persist/src/llvm/CMakeLists.txt
              echo "=== diagnostic done ==="

              # One-time wipe if the persistent dir still holds the legacy
              # three-stage layout from earlier CI iterations.
              if [ -d /persist/build/llvm ] || [ -d /persist/build/device-libs ] || [ -d /persist/build/comgr ]; then
                echo "Detected stale three-stage build layout; wiping for new unified layout."
                rm -rf /persist/build/*
              fi

              # ld.lld lives at /opt/rocm/llvm/bin/ in this container and is
              # not on the default PATH; LLVM_USE_LINKER=lld needs it findable
              # by the host gcc before LLVM has built its own lld.
              export PATH=/opt/rocm/llvm/bin:$PATH

              # Build invocation mirrors the documented one at
              # rocm-hotswap-testing/docs/gpt-oss-e2e.md:
              #   * comgr + device-libs live inside the LLVM build tree as
              #     LLVM_EXTERNAL_PROJECTS, so libamd_comgr.so ends up in
              #     /persist/build/lib next to LLVM libs and lit-built test
              #     binaries pick OUR libamd_comgr.so by normal build-tree
              #     lookup (not /opt/rocm/lib).
              #   * device-libs is listed FIRST so its targets register the
              #     AMD_DEVICE_LIBS global property before comgr's
              #     DeviceLibs.cmake (line 151) reads it.
              #   * HOTSWAP_TRANSPILER_LLVM_TOOLS_DIR is baked into the comgr
              #     build; raise_cli shells out to llc / llvm-mc / ld.lld
              #     using this dir.
              #   * LLVM_USE_LINKER=lld speeds up linking.
              #
              # CMAKE_DISABLE_FIND_PACKAGE_hip is an addition over the docs:
              # comgr/test/CMakeLists.txt:214 calls find_package(hip), which
              # transitively loads /opt/rocm/lib/cmake/AMDDeviceLibsConfig.cmake
              # and collides with our in-tree device-libs targets. The
              # find_package(hip) result is unused in test/CMakeLists.txt so
              # disabling is safe.
              cmake -G Ninja -S /persist/src/llvm -B /persist/build \
                -DCMAKE_BUILD_TYPE=Release \
                -DLLVM_ENABLE_PROJECTS="clang;lld" \
                -DLLVM_TARGETS_TO_BUILD="X86;AMDGPU" \
                -DLLVM_EXTERNAL_PROJECTS="device-libs;comgr" \
                -DLLVM_EXTERNAL_DEVICE_LIBS_SOURCE_DIR=/persist/src/amd/device-libs \
                -DLLVM_EXTERNAL_COMGR_SOURCE_DIR=/persist/src/amd/comgr \
                -DCOMGR_ENABLE_HOTSWAP_TRANSPILE=ON \
                -DHOTSWAP_TRANSPILER_LLVM_TOOLS_DIR=/persist/build/bin \
                -DLLVM_USE_LINKER=lld \
                -DLLVM_CCACHE_BUILD=ON \
                -DCMAKE_DISABLE_FIND_PACKAGE_hip=ON

              # -j 32 keeps load + I/O polite on the shared 256-core host.
              ninja -j 32 -C /persist/build check-comgr

              ccache -s
            '
