name: Hotswap PR CI

on:
  pull_request:
  push:
    branches: [hotswap, alola-port-test]
  workflow_dispatch:
    inputs:
      force_clean:
        description: "Wipe persistent build dir before configuring"
        type: boolean
        default: false

concurrency:
  group: hotswap-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lit:
    # Runs on the Alola self-hosted runner inside an enroot container
    # built from rocm/pytorch (mirrored to Harbor as
    # registry-sc-harbor.amd.com/hotswap-ci/rocm-pytorch). The runner
    # itself lives at ~/ci/actions-runner inside the container; $HOME
    # is NFS-backed and persists across container restarts.
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    env:
      # Persistent locations on NFS (~/ci/persist survives container
      # rebuilds; /tmp is a 1.2 TB tmpfs but vanishes on container
      # restart, so we keep the build dir on NFS for incrementality).
      BUILD_DIR: /root/ci/persist/build
      CCACHE_DIR: /root/ci/persist/ccache
      LIT_LOG: /root/ci/persist/build/lit-output.log
      # /opt/rocm/llvm/bin holds clang, ld.lld, llvm-mc, FileCheck,
      # not, llvm-dis, llvm-readelf, llvm-objdump etc. Putting it
      # first means LLVM_USE_LINKER=lld finds ld.lld before the host
      # gcc would look for the system linker.
      PATH_PREFIX: /opt/rocm/llvm/bin

    steps:
      - uses: actions/checkout@v4

      - name: Force clean (manual trigger only)
        if: ${{ inputs.force_clean == true }}
        run: rm -rf "$BUILD_DIR"/*

      - name: Build + lit
        run: |
          set -euo pipefail
          export PATH="${PATH_PREFIX}:${PATH}"
          mkdir -p "$BUILD_DIR" "$CCACHE_DIR"

          # comgr reads git commit/branch into COMGR_GIT_COMMIT /
          # COMGR_GIT_BRANCH at configure time; without
          # safe.directory it ends up "not-available" because we run
          # as root over an NFS workspace owned by a non-root uid.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Always wipe a stale CMakeCache.txt: this workflow has gone
          # through several incompatible layouts and a stale cache
          # makes cmake fail with confusing errors. ccache (separate
          # dir) still amortizes individual cc1 invocations, so a
          # fresh configure stays fast.
          rm -f "$BUILD_DIR"/CMakeCache.txt

          # Build invocation:
          #   * comgr + device-libs live inside the LLVM build tree
          #     as LLVM_EXTERNAL_PROJECTS so libamd_comgr.so ends up
          #     in $BUILD_DIR/lib next to LLVM libs and lit-built test
          #     binaries pick OUR libamd_comgr.so by normal build-tree
          #     lookup (not /opt/rocm/lib).
          #   * device-libs is listed FIRST so its targets register
          #     the AMD_DEVICE_LIBS global property before comgr's
          #     DeviceLibs.cmake (line 151) reads it.
          #   * HOTSWAP_TRANSPILER_LLVM_TOOLS_DIR is baked into the
          #     comgr build; raise_cli shells out to llc / llvm-mc /
          #     ld.lld using this dir.
          #   * LLVM_USE_LINKER=lld speeds up linking.
          #   * CMAKE_DISABLE_FIND_PACKAGE_hip skips a find_package
          #     call in comgr/test/CMakeLists.txt:214 that transitively
          #     loads /opt/rocm/lib/cmake/AMDDeviceLibsConfig.cmake
          #     and collides with our in-tree device-libs targets.
          cmake -G Ninja -S "$GITHUB_WORKSPACE/llvm" -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="X86;AMDGPU" \
            -DLLVM_EXTERNAL_PROJECTS="device-libs;comgr" \
            -DLLVM_EXTERNAL_DEVICE_LIBS_SOURCE_DIR="$GITHUB_WORKSPACE/amd/device-libs" \
            -DLLVM_EXTERNAL_COMGR_SOURCE_DIR="$GITHUB_WORKSPACE/amd/comgr" \
            -DCOMGR_ENABLE_HOTSWAP_TRANSPILE=ON \
            -DHOTSWAP_TRANSPILER_LLVM_TOOLS_DIR="$BUILD_DIR/bin" \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_CCACHE_BUILD=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_hip=ON

          # -j 32 keeps load + I/O polite on the shared 192-core host.
          # pipefail ensures the step fails if ninja fails even though
          # tee succeeds. The lit log lands on NFS so the next step
          # (on the same runner) can read it without bind mounts.
          ninja -j 32 -C "$BUILD_DIR" check-comgr 2>&1 \
            | tee "$LIT_LOG"

          ccache -s

      - name: Summarize lit results
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$LIT_LOG" ]; then
            echo "no lit log at $LIT_LOG (ninja likely failed before lit ran)" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # strip ANSI color escapes the lit/FileCheck output is full of
          NOCOLOR=$(mktemp)
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LIT_LOG" > "$NOCOLOR"

          {
            echo "## Lit test summary"
            echo
            echo '```'
            grep -E \
              "Total Discovered|^  Passed|^  Failed|^  Unsupported|^  Expectedly|^  Unresolved|^Testing Time" \
              "$NOCOLOR" | tail -10 || echo "(no summary block found)"
            echo '```'

            if grep -q "^Failed Tests" "$NOCOLOR"; then
              FAILED_LIST=$(sed -n '/^Failed Tests/,/^Testing Time:/p' "$NOCOLOR" \
                            | grep -E "^\s+Comgr :: " \
                            | sed -E 's/^\s+Comgr :: //')

              echo
              echo "### Failures grouped by suite"
              echo
              echo '| Suite | Count |'
              echo '|-------|-------|'
              # Bucket key: subdir if the path has one (hotswap-raise/foo.s
              # -> hotswap-raise), otherwise the filename stem truncated
              # at the first two '-' segments so hotswap-* families stay
              # visible instead of collapsing under "(root)".
              echo "$FAILED_LIST" \
                | awk -F/ '
                    NF > 1 { print $1; next }
                    {
                      stem = $1
                      sub(/\..*$/, "", stem)
                      n = split(stem, parts, "-")
                      if (n >= 2)
                        print parts[1] "-" parts[2]
                      else
                        print stem
                    }' \
                | sort | uniq -c | sort -rn \
                | awk '{ printf "| %s | %d |\n", $2, $1 }'

              echo
              echo "<details><summary>All failed tests</summary>"
              echo
              echo '```'
              echo "$FAILED_LIST"
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
