name: Hotswap PR CI

on:
  pull_request:
  push:
    branches: [hotswap, alola-port-test]
  workflow_dispatch:
    inputs:
      force_clean:
        description: "Wipe persistent ccache before configuring"
        type: boolean
        default: false

concurrency:
  group: hotswap-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lit:
    # The GHA runner lives on the Alola login node inside a
    # rocm/pytorch-based enroot dev container. It does almost no work
    # itself -- the actual build + lit run is dispatched to a SLURM
    # compute node via srun, which spins up a fresh enroot from the
    # same sqsh on a dedicated CPU-only node. Login-node contention
    # (100+ users) made cold compiles take 5 minutes per file during
    # bring-up; the compile-* nodes are dedicated and idle.
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    env:
      # Persistent across SLURM jobs. NFS-backed via $HOME -> /home_mkm/AMD/...
      CCACHE_DIR: /root/ci/persist/ccache
      LIT_LOG: /root/ci/persist/build/lit-output.log
      # Base enroot sqsh on /cluster (visible from any compute node).
      # Mirrored from Docker Hub once via docker push; see
      # alola-ci-setup.md section 0c.
      CONTAINER_IMAGE: /cluster/images/nisenthi/registry-sc-harbor.amd.com_hotswap-ci_rocm-pytorch_latest.sqsh

    steps:
      - uses: actions/checkout@v4

      - name: Force clean ccache (manual trigger only)
        if: ${{ inputs.force_clean == true }}
        run: rm -rf "$CCACHE_DIR"/*

      - name: Build + lit (srun -> defq CPU node)
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR" "$(dirname "$LIT_LOG")"

          # The whole build script lives in
          # .github/workflows/scripts/hotswap-build.sh (checked in
          # alongside this workflow) so we don't fight nested-quoting
          # bugs in bash -c '...'. srun runs the script inside a
          # fresh container on a defq CPU node, inheriting our env.
          srun \
            --partition=defq \
            --constraint=CPUONLY \
            --time=2:00:00 \
            --nodes=1 \
            --cpus-per-task=64 \
            --mem=128G \
            --job-name=hotswap-pr-${{ github.run_id }} \
            --container-image="$CONTAINER_IMAGE" \
            --container-mount-home \
            bash "$GITHUB_WORKSPACE/.github/workflows/scripts/hotswap-build.sh" \
            2>&1 | tee "$LIT_LOG"

      - name: Summarize lit results
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$LIT_LOG" ]; then
            echo "no lit log at $LIT_LOG (srun failed before lit ran)" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # strip ANSI color escapes the lit/FileCheck output is full of
          NOCOLOR=$(mktemp)
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LIT_LOG" > "$NOCOLOR"

          {
            echo "## Lit test summary"
            echo
            echo '```'
            grep -E \
              "Total Discovered|^  Passed|^  Failed|^  Unsupported|^  Expectedly|^  Unresolved|^Testing Time" \
              "$NOCOLOR" | tail -10 || echo "(no summary block found)"
            echo '```'

            if grep -q "^Failed Tests" "$NOCOLOR"; then
              FAILED_LIST=$(sed -n '/^Failed Tests/,/^Testing Time:/p' "$NOCOLOR" \
                            | grep -E "^\s+Comgr :: " \
                            | sed -E 's/^\s+Comgr :: //')

              echo
              echo "### Failures grouped by suite"
              echo
              echo '| Suite | Count |'
              echo '|-------|-------|'
              # Bucket key: subdir if the path has one (hotswap-raise/foo.s
              # -> hotswap-raise), otherwise the filename stem truncated
              # at the first two '-' segments so hotswap-* families stay
              # visible instead of collapsing under "(root)".
              echo "$FAILED_LIST" \
                | awk -F/ '
                    NF > 1 { print $1; next }
                    {
                      stem = $1
                      sub(/\..*$/, "", stem)
                      n = split(stem, parts, "-")
                      if (n >= 2)
                        print parts[1] "-" parts[2]
                      else
                        print stem
                    }' \
                | sort | uniq -c | sort -rn \
                | awk '{ printf "| %s | %d |\n", $2, $1 }'

              echo
              echo "<details><summary>All failed tests</summary>"
              echo
              echo '```'
              echo "$FAILED_LIST"
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
