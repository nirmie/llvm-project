name: PyTorch HotSwap E2E

# Short per-PR model suite: one representative per model-support-plan group
# (martin-luecke/rocm-systems#70). Models with staged weights run; the rest
# show as PENDING in the summary so every group is visible:
#   G1 dense LLM   phi4_mini (transpiles 54 kernels), qwen2_5_7b_instruct
#   G2 MoE         qwen1_5_moe_a2_7b_chat        (weights pending)
#   G3 VLM         qwen2_5_vl_7b_instruct        (weights pending)
#   G4 diffusion   sd_3_5_large
#   G5 encoder     bge_large_en_v1_5             (boilerplate; new workload)
# Dispatch-only: the combined hotswap-e2e.yml (per-model matrix, single image)
# is now the PR/nightly e2e gate. This single-job pytorch-only workflow is kept
# for manual ad-hoc runs against the standalone pytorch-runner image.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated model config stems under data/pytorch/models/"
        type: string
        default: "qwen2_5_7b_instruct phi4_mini qwen1_5_moe_a2_7b_chat qwen2_5_vl_7b_instruct sd_3_5_large bge_large_en_v1_5"
      target_gfx:
        description: "GPU ISA to transpile gfx1250 kernels to"
        type: choice
        options: [gfx950, gfx942]
        default: gfx950
      harness_ref:
        description: "rocm-hotswap-testing git ref to pin the harness source to"
        type: string
        default: "users/nirmie/pytorch-model-agnostic-debug"
      timeout_seconds:
        description: "Per-workload cap (cold transpile of all GEMM kernels needs >900s)"
        type: string
        default: "3600"
      inject_pr_comgr:
        description: "Use the comgr freshly built from this llvm-project commit instead of the baked one"
        type: boolean
        default: false

concurrency:
  group: pytorch-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Same self-hosted runner as the lit CI (Alola login-node dev container).
    # It does no GPU work itself; it srun's the run into a fresh pytorch-runner
    # enroot on a GPU compute node.
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    env:
      # Compute-node-visible paths (NFS from ags-pure-mkm-01 / local /home).
      COMPUTE_HOME: /home/AMD/nisenthi
      # The valid 34G pytorch-runner sqsh (NOT the broken 19M /cluster stub).
      CONTAINER_IMAGE: /home/AMD/nisenthi/registry-sc-harbor.amd.com_hotswap-ci_pytorch-runner_latest.sqsh
      # Selectively-staged model weights (gfx_apps fleet rsync'd here per-model;
      # compute-visible + service-account readable).
      MODELS_ROOT: /projects/hotswap-ci/models
      # Pinned harness checkout (scripts/data/runtime/Makefile bind-mounted over
      # the image's frozen copies -- see scripts/pytorch-e2e.sh "Harness overlay").
      HARNESS_REPO: https://github.com/harsh-amd/rocm-hotswap-testing.git
      HARNESS_CHECKOUT: /cluster/hotswap-ci/rocm-hotswap-testing
      # Corrected model configs (/projects/hotswap-ci paths + sd_3_5_large),
      # overlaid after /harness so they win. Temporary until these paths are
      # committed to the harness branch itself.
      CI_CONFIGS: /cluster/hotswap-ci/model-configs
      # Persistent HotSwap translation cache (host path); accumulates across runs.
      CACHE_HOST: /home/AMD/nisenthi/hotswap-cache-shared
      # Per-run output root, on the runner's home (=== $COMPUTE_HOME via mount-home).
      OUTPUT_ROOT: /root/ci/pytorch-output
      # Where the lit job builds libamd_comgr.so + lld/llc/llvm-mc (must be on
      # shared NFS for the GPU node to read it; see inject_pr_comgr note below).
      COMGR_BUILD_DIR: /home/AMD/nisenthi/ci/persist/build

    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned harness checkout
        run: |
          set -euo pipefail
          CO="${HARNESS_CHECKOUT/#\/root/$COMPUTE_HOME}"
          if [ ! -d "$CO/.git" ]; then
            git clone "$HARNESS_REPO" "$CO"
          fi
          git -C "$CO" fetch --all --prune
          git -C "$CO" checkout "${{ inputs.harness_ref || 'users/nirmie/pytorch-model-agnostic-debug' }}"
          git -C "$CO" pull --ff-only || true   # no-op for detached sha
          echo "harness at $(git -C "$CO" rev-parse --short HEAD) ($(git -C "$CO" rev-parse --abbrev-ref HEAD))"

      - name: Run PyTorch E2E (srun -> gfx GPU node)
        run: |
          set -euo pipefail

          # Inputs are empty on pull_request; fall back to the short PR suite.
          MODELS_IN="${{ inputs.models || 'qwen2_5_7b_instruct phi4_mini qwen1_5_moe_a2_7b_chat qwen2_5_vl_7b_instruct sd_3_5_large bge_large_en_v1_5' }}"
          TARGET_GFX="${{ inputs.target_gfx || 'gfx950' }}"
          TIMEOUT_IN="${{ inputs.timeout_seconds || '3600' }}"
          INJECT_COMGR="${{ inputs.inject_pr_comgr || 'false' }}"

          # GRES/constraint from the requested ISA.
          case "$TARGET_GFX" in
            gfx950) GPU_SEL=(--constraint=GFX950 --gres=gpu:1) ;;
            gfx942) GPU_SEL=(--gres=gpu:gfx942-mi300x:1) ;;
            *) echo "unknown target_gfx $TARGET_GFX" >&2; exit 1 ;;
          esac

          # Translate runner-side /root paths to the compute node's real NFS
          # path. The runner's HOME is remapped to /root via enroot
          # --container-mount-home; compute nodes mount /home/AMD/nisenthi
          # directly, so every /root path crossing the srun boundary
          # (workspace for --chdir + mount + the script, output, harness)
          # must be rewritten or srun can't chdir/find them.
          export GITHUB_WORKSPACE="${GITHUB_WORKSPACE/#\/root/$COMPUTE_HOME}"
          OUTPUT_COMPUTE="${OUTPUT_ROOT/#\/root/$COMPUTE_HOME}"
          HARNESS_COMPUTE="${HARNESS_CHECKOUT/#\/root/$COMPUTE_HOME}"
          mkdir -p "$OUTPUT_COMPUTE"

          # Export run vars in the shell; srun --export=ALL inherits them.
          # (Inline --export=ALL,VAR=/path with slashes is unreliable.)
          export MODELS="$MODELS_IN"
          export TARGET_GFX
          export PYTORCH_TIMEOUT_SECONDS="$TIMEOUT_IN"
          export CACHE_DIR=/cache

          # Build the bind-mount list (single whitespace-free string).
          MOUNTS="$MODELS_ROOT:$MODELS_ROOT:ro"
          MOUNTS="$MOUNTS,$HARNESS_COMPUTE:/harness:ro"
          MOUNTS="$MOUNTS,$CI_CONFIGS:/ci-configs:ro"
          MOUNTS="$MOUNTS,$CACHE_HOST:/cache"
          MOUNTS="$MOUNTS,$OUTPUT_COMPUTE:/output"
          MOUNTS="$MOUNTS,$GITHUB_WORKSPACE:$GITHUB_WORKSPACE"

          # Optional: inject the comgr freshly built by the lit job from this
          # commit. Requires the lit build to publish libamd_comgr.so.3 + the
          # LLVM tools to $COMGR_BUILD_DIR on shared NFS (follow-up; see README).
          if [ "$INJECT_COMGR" = "true" ]; then
            BD="${COMGR_BUILD_DIR/#\/root/$COMPUTE_HOME}"
            COMGR_SO="$(ls "$BD"/lib/libamd_comgr.so.3* 2>/dev/null | head -1 || true)"
            if [ -z "$COMGR_SO" ]; then
              echo "::error::inject_pr_comgr=true but no libamd_comgr.so.3* under $BD/lib" >&2
              exit 1
            fi
            MOUNTS="$MOUNTS,$BD:$BD:ro"
            export COMGR_RUNTIME="$COMGR_SO"
            export COMGR_TOOLS_DIR="$BD/bin"
          fi

          srun \
            --partition=defq \
            "${GPU_SEL[@]}" \
            --time=2:00:00 \
            --nodes=1 \
            --cpus-per-task=16 \
            --mem=128G \
            --job-name=pytorch-e2e-${{ github.run_id }} \
            --chdir="$GITHUB_WORKSPACE" \
            --container-image="$CONTAINER_IMAGE" \
            --container-writable \
            --container-remap-root \
            --container-mounts="$MOUNTS" \
            --export=ALL \
            bash "$GITHUB_WORKSPACE/.github/workflows/scripts/pytorch-e2e.sh"

      - name: Summarize E2E results
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/render-e2e-summary.py" \
            "$OUTPUT_ROOT" ${{ inputs.models || 'qwen2_5_7b_instruct phi4_mini qwen1_5_moe_a2_7b_chat qwen2_5_vl_7b_instruct sd_3_5_large bge_large_en_v1_5' }} >> "$GITHUB_STEP_SUMMARY" || true
