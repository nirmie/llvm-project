name: SGLang E2E gfx942

# Runs the issue #70 supported models (that have a harness profile + staged
# weights) through the SGLang HotSwap compare on a gfx942 (MI300X) runner.
# shark300 has NO gfx_apps NFS mount, so weights must be staged manually under
# WEIGHTS_HOST -> we keep this matrix to SMALL models only. The full model set
# runs on the gfx950 workflow (mi350), which reads weights from the NFS mount.
# One matrix leg per model; a leg SKIPS (not fails) if its weights aren't staged.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"   # nightly

concurrency:
  group: docker-e2e-gfx942
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: registry-sc-harbor.amd.com/rocm-hotswap/alex_hotswap_wip:latest
  WEIGHTS_HOST: /home/nisenthi/hotswap-data
  SCRATCH_BASE: /home/nisenthi/hotswap-ci-persist/e2e-gfx942
  GPU: "7"
  TARGET_GFX: gfx942

jobs:
  models:
    strategy:
      fail-fast: false
      matrix:
        # SMALL models only (shark300 has no NFS; weights staged manually).
        # Larger supported models (llama-8B, gemma-2-9b, ...) run on gfx950.
        include:
          - { name: qwen3_0_6b,   profile: qwen3_0_6b,   subpath: Qwen3-0.6B }
          - { name: qwen3_5_4b,   profile: qwen3_5_4b,   subpath: Qwen3.5-4B }
          - { name: gemma3_4b_it, profile: gemma3_4b_it, subpath: gemma-3-4b-it }
    name: ${{ matrix.name }}
    runs-on: [self-hosted, linux, rocm, docker, gfx942]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Run ${{ matrix.name }}
        shell: bash --noprofile --norc {0}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/scripts/run-sglang-model.sh" "${{ matrix.name }}" "${{ matrix.profile }}" "${{ matrix.subpath }}" "${{ matrix.prompts }}"
