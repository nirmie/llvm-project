name: Docker E2E gfx942 (SGLang HotSwap)

# Runs the issue #70 supported models (that have a harness profile + staged
# weights) through the SGLang HotSwap compare on a gfx942 (MI300X) runner.
# One matrix leg per model; a leg SKIPS (not fails) if its weights aren't
# staged on the host. Weights live under WEIGHTS_HOST on shark300; stream more
# models there to extend coverage. Separate from the gfx950 workflow on purpose.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"   # nightly

concurrency:
  group: docker-e2e-gfx942
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: registry-sc-harbor.amd.com/rocm-hotswap/alex_wip:latest
  WEIGHTS_HOST: /home/nisenthi/hotswap-data
  SCRATCH_BASE: /home/nisenthi/hotswap-ci-persist/e2e-gfx942
  GPU: "7"
  TARGET_GFX: gfx942

jobs:
  models:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: qwen3_0_6b,   subpath: Qwen3-0.6B }
          - { profile: qwen3_5_4b,   subpath: Qwen3.5-4B }
          - { profile: llama,        subpath: Llama-3.1-8B-Instruct }
          - { profile: gemma2_9b_it, subpath: gemma-2-9b-it }
          - { profile: gemma3_4b_it, subpath: gemma-3-4b-it }
    name: ${{ matrix.profile }} (gfx942)
    runs-on: [self-hosted, linux, rocm, docker, gfx942]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Run ${{ matrix.profile }}
        shell: bash --noprofile --norc {0}
        run: bash "$GITHUB_WORKSPACE/.github/workflows/scripts/run-sglang-model.sh" "${{ matrix.profile }}" "${{ matrix.subpath }}"
