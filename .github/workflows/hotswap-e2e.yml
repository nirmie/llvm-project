name: Hotswap E2E (combined)

# Combined PyTorch + SGLang model E2E. One workflow, ONE image
# (hotswap-model-runner: run-model for pytorch + run-sglang-model for sglang),
# rendered as TWO separate tables. Each model is its own matrix job -> its own
# SLURM allocation -> its own step summary, so the run's Summary page grows
# CONTINUOUSLY as each SLURM job finishes. A crash in one model (OOM, segfault,
# srun --time) is contained to that job; fail-fast:false keeps the rest going.
# A final `aggregate` job renders the two consolidated tables AND publishes the
# per-model status badges to the orphan `ci-status` branch (README scoreboard).
#
# Triggers:
#   pull_request      -> representative subset (fast PR signal)
#   schedule (nightly)-> full model sweep (feeds the scoreboard)
#   workflow_dispatch -> choose rep or full + ISA
on:
  pull_request:
  schedule:
    - cron: "37 6 * * *"   # ~01:37 ET nightly full sweep
  workflow_dispatch:
    inputs:
      target_gfx:
        type: choice
        options: [gfx950, gfx942]
        default: gfx950
      sweep:
        description: "rep = representative subset, full = every model"
        type: choice
        options: [full, rep]
        default: full

concurrency:
  group: hotswap-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPUTE_HOME: /home/AMD/nisenthi
  # Single image: run-model (cp312/torch2.12) + run-sglang-model (cp310/torch2.9.1)
  # share one sqsh. Replaces the separate pytorch-runner / sglang-runner images.
  # MUST live on /cluster (visible from any compute node): GFX950 GPU nodes do
  # not reliably mount /home, and pyxis reads the image before triggering
  # automounts, so a /home image path fails with "No such file or directory".
  IMAGE: /cluster/images/nisenthi/registry-sc-harbor.amd.com_hotswap-ci_hotswap-model-runner_latest.sqsh
  MODELS_ROOT: /projects/hotswap-ci/models
  HARNESS_REPO: https://github.com/harsh-amd/rocm-hotswap-testing.git
  HARNESS_CHECKOUT: /cluster/hotswap-ci/rocm-hotswap-testing
  # sglang-model-agnostic-debug is the superset branch: pytorch scripts + the
  # sglang runner + the teacher-forced-skippable fix + CI model configs.
  HARNESS_REF: users/nirmie/sglang-model-agnostic-debug
  CI_CONFIGS: /cluster/hotswap-ci/model-configs
  CACHE_HOST: /home/AMD/nisenthi/hotswap-cache-shared
  OUTPUT_ROOT: /root/ci/hotswap-e2e/${{ github.run_id }}

jobs:
  # Pick the matrix by event: rep subset on PR (and dispatch sweep=rep), the
  # full model set on schedule (and dispatch sweep=full). Emitting the matrix as
  # JSON keeps PR runs to a handful of jobs on the single serialized runner.
  setup:
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      pyt: ${{ steps.pick.outputs.pyt }}
      sgl: ${{ steps.pick.outputs.sgl }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          REP_PYT="qwen2_5_7b_instruct,phi4_mini"; REP_SGL="llama"
          FULL_PYT="qwen2_5_7b_instruct,phi4_mini,qwen1_5_moe_a2_7b_chat,qwen2_5_vl_7b_instruct,sd_3_5_large,bge_large_en_v1_5"
          FULL_SGL="llama,phi4_mini"
          case "${{ github.event_name }}" in
            pull_request) PYT="$REP_PYT"; SGL="$REP_SGL" ;;
            schedule)     PYT="$FULL_PYT"; SGL="$FULL_SGL" ;;
            workflow_dispatch)
              if [ "${{ inputs.sweep }}" = "rep" ]; then PYT="$REP_PYT"; SGL="$REP_SGL";
              else PYT="$FULL_PYT"; SGL="$FULL_SGL"; fi ;;
            *) PYT="$FULL_PYT"; SGL="$FULL_SGL" ;;
          esac
          MATRIX=$(PYT="$PYT" SGL="$SGL" python3 -c 'import json,os; pyt=[m for m in os.environ["PYT"].split(",") if m]; sgl=[m for m in os.environ["SGL"].split(",") if m]; print(json.dumps({"include":[{"fw":"pytorch","model":m} for m in pyt]+[{"fw":"sglang","model":m} for m in sgl]}))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "pyt=$PYT" >> "$GITHUB_OUTPUT"
          echo "sgl=$SGL" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} pyt=$PYT sgl=$SGL"

  models:
    needs: setup
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: ${{ matrix.fw }}-${{ matrix.model }}
    steps:
      # Sparse + shallow: the runner only needs .github/workflows/scripts/* (the
      # srun driver scripts + renderers), NOT the 100k-file LLVM tree. A full
      # checkout writes the whole working tree to NFS home (~7 files/2min) and
      # pointlessly loads the shared login node. This keeps the login-node step
      # tiny; all heavy work runs on compute nodes via srun.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          fetch-depth: 1

      - name: Prepare pinned harness checkout
        run: |
          set -euo pipefail
          CO="${HARNESS_CHECKOUT/#\/root/$COMPUTE_HOME}"
          [ -d "$CO/.git" ] || git clone "$HARNESS_REPO" "$CO"
          git -C "$CO" fetch --all --prune
          git -C "$CO" checkout "$HARNESS_REF"
          git -C "$CO" pull --ff-only || true
          echo "harness at $(git -C "$CO" rev-parse --short HEAD)"

      - name: Run ${{ matrix.fw }} model ${{ matrix.model }}
        run: |
          set -euo pipefail
          OUTPUT_COMPUTE="${OUTPUT_ROOT/#\/root/$COMPUTE_HOME}"
          mkdir -p "$OUTPUT_COMPUTE/${{ matrix.model }}"

          TARGET_GFX="${{ inputs.target_gfx || 'gfx950' }}"
          # MARKHAM constraint is REQUIRED: only Markham nodes mount the Markham
          # NFS (/home, /cluster, /projects). Austin GFX950 nodes (smci355-ccs-aus-*,
          # mi355x) mount none of it, so srun fails to load the image/weights.
          case "$TARGET_GFX" in
            gfx950) GPU_SEL=("--constraint=GFX950&MARKHAM" --gres=gpu:1) ;;
            gfx942) GPU_SEL=("--constraint=MARKHAM" --gres=gpu:gfx942-mi300x:1) ;;
          esac
          export GITHUB_WORKSPACE="${GITHUB_WORKSPACE/#\/root/$COMPUTE_HOME}"
          HARNESS_COMPUTE="${HARNESS_CHECKOUT/#\/root/$COMPUTE_HOME}"

          if [ "${{ matrix.fw }}" = "pytorch" ]; then
            SCRIPT=pytorch-e2e.sh
            export MODELS="${{ matrix.model }}"
          else
            SCRIPT=sglang-e2e.sh
            export SGLANG_PROFILES="${{ matrix.model }}"
          fi
          export TARGET_GFX
          export PYTORCH_TIMEOUT_SECONDS=3600 CACHE_DIR=/cache

          MOUNTS="$MODELS_ROOT:$MODELS_ROOT:ro,$HARNESS_COMPUTE:/harness:ro,$CI_CONFIGS:/ci-configs:ro"
          MOUNTS="$MOUNTS,$CACHE_HOST:/cache,$OUTPUT_COMPUTE:/output,$GITHUB_WORKSPACE:$GITHUB_WORKSPACE"

          srun --partition=defq "${GPU_SEL[@]}" --time=2:00:00 --nodes=1 \
            --cpus-per-task=16 --mem=128G \
            --job-name=hotswap-e2e-${{ github.run_id }}-${{ matrix.model }} \
            --chdir="$GITHUB_WORKSPACE" --container-image="$IMAGE" \
            --container-writable --container-remap-root \
            --container-mounts="$MOUNTS" --export=ALL \
            bash "$GITHUB_WORKSPACE/.github/workflows/scripts/$SCRIPT"

      - name: Release SLURM allocation (cleanup)
        if: always()
        run: |
          # On cancel-in-progress the runner kills this step's shell and orphans
          # the srun on the GPU node, holding the (costly) allocation until
          # --time expires. scancel this model's uniquely-named job so the GPU
          # frees immediately on success, failure, or cancellation.
          JN="hotswap-e2e-${{ github.run_id }}-${{ matrix.model }}"
          LEFT=$(squeue --noheader --name="$JN" -o "%i %T" 2>/dev/null || true)
          if [ -n "$LEFT" ]; then
            echo "releasing lingering SLURM allocation for $JN:"; echo "$LEFT"
            scancel --name="$JN" 2>/dev/null || true
          else
            echo "no lingering SLURM allocation for $JN"
          fi

      - name: Summary row (continuous)
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/render-combined-summary.py" \
            "$OUTPUT_ROOT" "${{ matrix.fw }}=${{ matrix.model }}" >> "$GITHUB_STEP_SUMMARY" || true

  aggregate:
    needs: [setup, models]
    if: always()
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    # contents: write so the status-publish step can push the per-model badge
    # JSONs to the orphan `ci-status` branch (job-scoped; matrix jobs stay
    # read-only).
    permissions:
      contents: write
    steps:
      # Sparse + shallow: the runner only needs .github/workflows/scripts/* (the
      # srun driver scripts + renderers), NOT the 100k-file LLVM tree. A full
      # checkout writes the whole working tree to NFS home (~7 files/2min) and
      # pointlessly loads the shared login node. This keeps the login-node step
      # tiny; all heavy work runs on compute nodes via srun.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          fetch-depth: 1
      - name: Render consolidated PyTorch + SGLang tables
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/render-combined-summary.py" \
            "$OUTPUT_ROOT" \
            "pytorch=${{ needs.setup.outputs.pyt }}" \
            "sglang=${{ needs.setup.outputs.sgl }}" >> "$GITHUB_STEP_SUMMARY" || true

      # Publish the README scoreboard badges. Only the models that ran this time
      # are emitted; the publish step bases on the existing ci-status tree, so a
      # partial (rep) run leaves the other models' badges untouched. Skipped on
      # pull_request (transient + fork PRs get a read-only token).
      - name: Publish status badges to ci-status branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BADGES="$RUNNER_TEMP/badges"; rm -rf "$BADGES"; mkdir -p "$BADGES"
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/emit-status-badges.py" \
            "$OUTPUT_ROOT" "$BADGES" \
            "pytorch=${{ needs.setup.outputs.pyt }}" \
            "sglang=${{ needs.setup.outputs.sgl }}"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WT="$RUNNER_TEMP/ci-status"; rm -rf "$WT"; mkdir -p "$WT"
          cd "$WT"; git init -q; git remote add origin "$REMOTE"
          if git fetch -q --depth 1 origin ci-status 2>/dev/null; then
            git checkout -q -b ci-status FETCH_HEAD
          else
            git checkout -q --orphan ci-status
          fi
          cp -r "$BADGES/." .
          git add -A
          if git -c user.email=hotswap-ci@amd.com -c user.name="hotswap-ci" \
               commit -q -m "ci-status: run ${GITHUB_RUN_ID} ($(date -u +%FT%TZ))"; then
            git push -q origin HEAD:ci-status
            echo "published $(find "$BADGES" -name '*.json' | wc -l) badges to ci-status"
          else
            echo "no status change"
          fi
