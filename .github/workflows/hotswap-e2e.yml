name: Hotswap E2E (combined)

# Combined PyTorch + SGLang model E2E. One workflow, ONE image
# (hotswap-model-runner: run-model for pytorch + run-sglang-model for sglang),
# rendered as TWO separate tables.
#
# PARALLEL model scheduling: a single `e2e` job submits one `srun` per model in
# the BACKGROUND and lets SLURM schedule them across the Markham mi350x nodes,
# then `wait`s for all. This is one GH-runner pickup (robust against the single
# self-hosted runner's broker flakiness) while still running models concurrently.
# A crash in one model (OOM/segfault/--time) is contained to its srun; the others
# keep going. After all finish it renders the two tables AND publishes the
# per-model status badges to the orphan `ci-status` branch (README scoreboard).
#
# Triggers:
#   pull_request      -> representative subset (fast PR signal)
#   schedule (nightly)-> full model sweep (feeds the scoreboard)
#   workflow_dispatch -> choose rep or full + ISA
on:
  pull_request:
  schedule:
    - cron: "37 6 * * *"   # ~01:37 ET nightly full sweep
  workflow_dispatch:
    inputs:
      target_gfx:
        type: choice
        options: [gfx950, gfx942]
        default: gfx950
      sweep:
        description: "rep = representative subset, full = every model"
        type: choice
        options: [full, rep]
        default: full

concurrency:
  group: hotswap-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPUTE_HOME: /home/AMD/nisenthi
  # Single image on /cluster (GFX950 GPU nodes don't reliably mount /home, and
  # pyxis reads the image before triggering automounts).
  IMAGE: /cluster/images/nisenthi/registry-sc-harbor.amd.com_hotswap-ci_hotswap-model-runner_latest.sqsh
  MODELS_ROOT: /projects/hotswap-ci/models
  HARNESS_REPO: https://github.com/harsh-amd/rocm-hotswap-testing.git
  HARNESS_CHECKOUT: /cluster/hotswap-ci/rocm-hotswap-testing
  HARNESS_REF: users/nirmie/sglang-model-agnostic-debug
  CI_CONFIGS: /cluster/hotswap-ci/model-configs
  CACHE_HOST: /home/AMD/nisenthi/hotswap-cache-shared
  OUTPUT_ROOT: /root/ci/hotswap-e2e/${{ github.run_id }}
  # comgr-under-test override. EMPTY = use the image's BAKED comgr (already built
  # from the branch users/nirmie/hotswap-gfx11-12-13-alias). Only point this at a
  # KNOWN-GOOD freshly-built branch comgr+tools dir (lib/ + bin/); a stale build
  # raises `unsupported: s_load_b64` -> "no kernel image".
  COMGR_OVERRIDE_DIR: ""

jobs:
  # Pick the model lists by event: rep subset on PR (and dispatch sweep=rep), the
  # full set on schedule (and dispatch sweep=full).
  setup:
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    outputs:
      pyt: ${{ steps.pick.outputs.pyt }}
      sgl: ${{ steps.pick.outputs.sgl }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          REP_PYT="qwen2_5_7b_instruct,phi4_mini"; REP_SGL="llama"
          FULL_PYT="qwen2_5_7b_instruct,phi4_mini,qwen1_5_moe_a2_7b_chat,qwen2_5_vl_7b_instruct,sd_3_5_large,bge_large_en_v1_5"
          FULL_SGL="llama,phi4_mini"
          case "${{ github.event_name }}" in
            pull_request) PYT="$REP_PYT"; SGL="$REP_SGL" ;;
            schedule)     PYT="$FULL_PYT"; SGL="$FULL_SGL" ;;
            workflow_dispatch)
              if [ "${{ inputs.sweep }}" = "rep" ]; then PYT="$REP_PYT"; SGL="$REP_SGL";
              else PYT="$FULL_PYT"; SGL="$FULL_SGL"; fi ;;
            *) PYT="$FULL_PYT"; SGL="$FULL_SGL" ;;
          esac
          echo "pyt=$PYT" >> "$GITHUB_OUTPUT"
          echo "sgl=$SGL" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} pyt=$PYT sgl=$SGL"

  e2e:
    needs: setup
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    # contents: write so the badge-publish step can push to the orphan ci-status branch.
    permissions:
      contents: write
    steps:
      # Sparse + shallow: only need .github/workflows/scripts/*, not the 100k-file
      # LLVM tree (a full checkout crawls on NFS home).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          fetch-depth: 1

      - name: Prepare pinned harness checkout
        run: |
          set -euo pipefail
          CO="${HARNESS_CHECKOUT/#\/root/$COMPUTE_HOME}"
          [ -d "$CO/.git" ] || git clone "$HARNESS_REPO" "$CO"
          git -C "$CO" fetch --all --prune
          git -C "$CO" checkout "$HARNESS_REF"
          git -C "$CO" pull --ff-only || true
          echo "harness at $(git -C "$CO" rev-parse --short HEAD)"

      - name: Run all models in parallel (one srun each; SLURM schedules)
        run: |
          set -uo pipefail
          OUTPUT_COMPUTE="${OUTPUT_ROOT/#\/root/$COMPUTE_HOME}"
          export GITHUB_WORKSPACE="${GITHUB_WORKSPACE/#\/root/$COMPUTE_HOME}"
          HARNESS_COMPUTE="${HARNESS_CHECKOUT/#\/root/$COMPUTE_HOME}"

          TARGET_GFX="${{ inputs.target_gfx || 'gfx950' }}"
          # MARKHAM REQUIRED: only Markham nodes mount the Markham NFS; Austin
          # GFX950 nodes (mi355x) mount none of it.
          case "$TARGET_GFX" in
            gfx950) GPU_SEL=("--constraint=GFX950&MARKHAM" --gres=gpu:1) ;;
            gfx942) GPU_SEL=("--constraint=MARKHAM" --gres=gpu:gfx942-mi300x:1) ;;
          esac
          export TARGET_GFX

          BASE_MOUNTS="$MODELS_ROOT:$MODELS_ROOT:ro,$HARNESS_COMPUTE:/harness:ro,$CI_CONFIGS:/ci-configs:ro,$CACHE_HOST:/cache,$OUTPUT_COMPUTE:/output,$GITHUB_WORKSPACE:$GITHUB_WORKSPACE"
          COMGR_MOUNT=""
          if [ -n "${COMGR_OVERRIDE_DIR:-}" ] && [ -e "$COMGR_OVERRIDE_DIR/lib/libamd_comgr.so.3.3.0" ]; then
            COMGR_MOUNT=",$COMGR_OVERRIDE_DIR:/comgr-override:ro"
          fi

          pids=()
          launch() {
            local fw="$1" model="$2"
            mkdir -p "$OUTPUT_COMPUTE/$model"
            (
              export PYTORCH_TIMEOUT_SECONDS=3600 CACHE_DIR=/cache
              local script
              if [ "$fw" = pytorch ]; then script=pytorch-e2e.sh; export MODELS="$model"
              else script=sglang-e2e.sh; export SGLANG_PROFILES="$model"; fi
              if [ -n "$COMGR_MOUNT" ]; then
                export COMGR_RUNTIME=/comgr-override/lib/libamd_comgr.so.3.3.0 COMGR_TOOLS_DIR=/comgr-override/bin
              fi
              srun --partition=defq "${GPU_SEL[@]}" --time=1:00:00 --nodes=1 \
                --cpus-per-task=16 --mem=128G \
                --job-name="hotswap-e2e-${{ github.run_id }}-$model" \
                --chdir="$GITHUB_WORKSPACE" --container-image="$IMAGE" \
                --container-writable --container-remap-root \
                --container-mounts="$BASE_MOUNTS$COMGR_MOUNT" --export=ALL \
                bash "$GITHUB_WORKSPACE/.github/workflows/scripts/$script"
            ) > "$OUTPUT_COMPUTE/$model/srun.log" 2>&1 &
            pids+=("$!|$fw/$model")
            echo "launched $fw/$model (pid $!)"
          }

          for m in $(echo "${{ needs.setup.outputs.pyt }}" | tr ',' ' '); do [ -n "$m" ] && launch pytorch "$m"; done
          for m in $(echo "${{ needs.setup.outputs.sgl }}" | tr ',' ' '); do [ -n "$m" ] && launch sglang "$m"; done

          echo "waiting for ${#pids[@]} model job(s) (SLURM is scheduling them)..."
          rc=0
          for entry in "${pids[@]}"; do
            pid="${entry%%|*}"; name="${entry#*|}"
            if wait "$pid"; then echo "PASS $name"; else echo "FAIL $name"; rc=1; fi
          done
          echo "all model jobs finished (rc=$rc)"
          exit $rc

      - name: Release SLURM allocations (cleanup)
        if: always()
        run: |
          # Free any srun from THIS run (cancel-in-progress orphans them otherwise).
          PFX="hotswap-e2e-${{ github.run_id }}-"
          IDS=$(squeue --noheader -u "$(id -un)" -o "%i|%j" 2>/dev/null | awk -F'|' -v p="$PFX" 'index($2,p)==1{print $1}')
          if [ -n "$IDS" ]; then echo "scancel: $IDS"; scancel $IDS 2>/dev/null || true; else echo "no lingering allocations"; fi

      - name: Render consolidated PyTorch + SGLang tables
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/render-combined-summary.py" \
            "$OUTPUT_ROOT" \
            "pytorch=${{ needs.setup.outputs.pyt }}" \
            "sglang=${{ needs.setup.outputs.sgl }}" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publish status badges to ci-status branch
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BADGES="$RUNNER_TEMP/badges"; rm -rf "$BADGES"; mkdir -p "$BADGES"
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/emit-status-badges.py" \
            "$OUTPUT_ROOT" "$BADGES" \
            "pytorch=${{ needs.setup.outputs.pyt }}" \
            "sglang=${{ needs.setup.outputs.sgl }}"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          WT="$RUNNER_TEMP/ci-status"; rm -rf "$WT"; mkdir -p "$WT"
          cd "$WT"; git init -q; git remote add origin "$REMOTE"
          if git fetch -q --depth 1 origin ci-status 2>/dev/null; then
            git checkout -q -b ci-status FETCH_HEAD
          else
            git checkout -q --orphan ci-status
          fi
          cp -r "$BADGES/." .
          git add -A
          if git -c user.email=hotswap-ci@amd.com -c user.name="hotswap-ci" \
               commit -q -m "ci-status: run ${GITHUB_RUN_ID} ($(date -u +%FT%TZ))"; then
            git push -q origin HEAD:ci-status
            echo "published $(find "$BADGES" -name '*.json' | wc -l) badges to ci-status"
          else
            echo "no status change"
          fi
