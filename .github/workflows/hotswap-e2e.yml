name: Hotswap E2E (combined)

# Combined PyTorch + SGLang model E2E. One workflow, two frameworks, rendered
# as TWO separate tables. Each model is its own matrix job -> its own SLURM
# allocation -> its own step summary, so the run's Summary page grows
# CONTINUOUSLY as each SLURM job finishes (instead of one end-of-run render).
# A final `aggregate` job renders the two consolidated tables.
#
# Dispatch-only for now while it's validated; the live PR gate stays on
# pytorch-e2e.yml until this replaces it. SGLang rows render as PENDING until
# the sglang-runner image integration lands (see rep_hotswap/sglang-runner:
# sglang pins torch==2.9.1 vs the base ROCm torch 2.12 -- WIP).
on:
  workflow_dispatch:
    inputs:
      target_gfx:
        type: choice
        options: [gfx950, gfx942]
        default: gfx950
      sglang_ready:
        description: "Set true once the sglang-runner sqsh is on Alola to actually run SGLang jobs"
        type: boolean
        default: false

concurrency:
  group: hotswap-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPUTE_HOME: /home/AMD/nisenthi
  PYTORCH_IMAGE: /home/AMD/nisenthi/registry-sc-harbor.amd.com_hotswap-ci_pytorch-runner_latest.sqsh
  SGLANG_IMAGE: /home/AMD/nisenthi/registry-sc-harbor.amd.com_hotswap-ci_sglang-runner_latest.sqsh
  MODELS_ROOT: /projects/hotswap-ci/models
  HARNESS_REPO: https://github.com/harsh-amd/rocm-hotswap-testing.git
  HARNESS_CHECKOUT: /cluster/hotswap-ci/rocm-hotswap-testing
  CI_CONFIGS: /cluster/hotswap-ci/model-configs
  CACHE_HOST: /home/AMD/nisenthi/hotswap-cache-shared
  # Per-run output root (run_id-scoped so matrix jobs + aggregate share one
  # isolated dir without stale data from prior runs).
  OUTPUT_ROOT: /root/ci/hotswap-e2e/${{ github.run_id }}

jobs:
  models:
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fw: pytorch, model: qwen2_5_7b_instruct }
          - { fw: pytorch, model: phi4_mini }
          - { fw: pytorch, model: qwen1_5_moe_a2_7b_chat }
          - { fw: pytorch, model: qwen2_5_vl_7b_instruct }
          - { fw: pytorch, model: sd_3_5_large }
          - { fw: pytorch, model: bge_large_en_v1_5 }
          - { fw: sglang,  model: llama }
          - { fw: sglang,  model: phi4_mini }
    name: ${{ matrix.fw }}-${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned harness checkout
        run: |
          set -euo pipefail
          CO="${HARNESS_CHECKOUT/#\/root/$COMPUTE_HOME}"
          [ -d "$CO/.git" ] || git clone "$HARNESS_REPO" "$CO"
          git -C "$CO" fetch --all --prune
          git -C "$CO" checkout users/nirmie/pytorch-model-agnostic-debug
          git -C "$CO" pull --ff-only || true

      - name: Run ${{ matrix.fw }} model ${{ matrix.model }}
        run: |
          set -euo pipefail
          OUTPUT_COMPUTE="${OUTPUT_ROOT/#\/root/$COMPUTE_HOME}"
          mkdir -p "$OUTPUT_COMPUTE/${{ matrix.model }}"

          # SGLang path is not runnable until the sglang-runner sqsh exists on
          # Alola; mark PENDING so the SGLang table shows the slot without failing.
          if [ "${{ matrix.fw }}" = "sglang" ] && [ "${{ inputs.sglang_ready }}" != "true" ]; then
            echo "sglang-runner image integration WIP (torch 2.9.1 pin vs ROCm 2.12)" \
              > "$OUTPUT_COMPUTE/${{ matrix.model }}/PENDING"
            echo "SGLang ${{ matrix.model }}: PENDING (image not ready)"; exit 0
          fi

          case "${{ inputs.target_gfx }}" in
            gfx950) GPU_SEL=(--constraint=GFX950 --gres=gpu:1) ;;
            gfx942) GPU_SEL=(--gres=gpu:gfx942-mi300x:1) ;;
          esac
          export GITHUB_WORKSPACE="${GITHUB_WORKSPACE/#\/root/$COMPUTE_HOME}"
          HARNESS_COMPUTE="${HARNESS_CHECKOUT/#\/root/$COMPUTE_HOME}"

          if [ "${{ matrix.fw }}" = "pytorch" ]; then
            IMAGE="$PYTORCH_IMAGE"; SCRIPT=pytorch-e2e.sh
            export MODELS="${{ matrix.model }}"
          else
            IMAGE="$SGLANG_IMAGE"; SCRIPT=sglang-e2e.sh
            export SGLANG_PROFILES="${{ matrix.model }}"
          fi
          export TARGET_GFX="${{ inputs.target_gfx }}"
          export PYTORCH_TIMEOUT_SECONDS=3600 CACHE_DIR=/cache

          MOUNTS="$MODELS_ROOT:$MODELS_ROOT:ro,$HARNESS_COMPUTE:/harness:ro,$CI_CONFIGS:/ci-configs:ro"
          MOUNTS="$MOUNTS,$CACHE_HOST:/cache,$OUTPUT_COMPUTE:/output,$GITHUB_WORKSPACE:$GITHUB_WORKSPACE"

          srun --partition=defq "${GPU_SEL[@]}" --time=2:00:00 --nodes=1 \
            --cpus-per-task=16 --mem=128G \
            --job-name=hotswap-e2e-${{ github.run_id }}-${{ matrix.model }} \
            --chdir="$GITHUB_WORKSPACE" --container-image="$IMAGE" \
            --container-writable --container-remap-root \
            --container-mounts="$MOUNTS" --export=ALL \
            bash "$GITHUB_WORKSPACE/.github/workflows/scripts/$SCRIPT"

      - name: Summary row (continuous)
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/render-combined-summary.py" \
            "$OUTPUT_ROOT" "${{ matrix.fw }}=${{ matrix.model }}" >> "$GITHUB_STEP_SUMMARY" || true

  aggregate:
    needs: models
    if: always()
    runs-on: [self-hosted, linux, rocm, alola, hotswap]
    steps:
      - uses: actions/checkout@v4
      - name: Render consolidated PyTorch + SGLang tables
        run: |
          python3 "$GITHUB_WORKSPACE/.github/workflows/scripts/render-combined-summary.py" \
            "$OUTPUT_ROOT" \
            "pytorch=qwen2_5_7b_instruct,phi4_mini,qwen1_5_moe_a2_7b_chat,qwen2_5_vl_7b_instruct,sd_3_5_large,bge_large_en_v1_5" \
            "sglang=llama,phi4_mini" >> "$GITHUB_STEP_SUMMARY" || true
